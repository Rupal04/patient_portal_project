<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patient Portal</title><style>body{font:16px system-ui;background:#f3f6fb;color:#17243a;margin:0}main{max-width:1100px;margin:40px auto;padding:20px}header,.panel{background:white;border-radius:12px;padding:24px;margin-bottom:18px;box-shadow:0 2px 10px #dce3ee}h1{margin:0 0 8px}input,select,button{padding:10px;margin:5px;border:1px solid #bdc9d9;border-radius:7px}button{background:#1759b3;color:white;cursor:pointer}button:disabled{background:#999}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e4e8ee}#message{min-height:25px;color:#b12424}small{color:#667} .scroll{overflow:auto}</style></head><body><main><header><h1>Patient Portal</h1><p>Switch between demo users to manage appointment requests.</p><label>Current user <select id="user">{% for u in users %}<option value="{{u.id}}" data-role="{{u.role}}">{{u.name}} ({{u.role}})</option>{% endfor %}</select></label><button onclick="load()">Refresh</button><p id="message" role="alert"></p></header><section class="panel" id="request"><h2>Request appointment</h2><form id="form"><label>Provider <select id="provider">{% for u in users %}{% if u.role == 'provider' %}<option value="{{u.id}}">{{u.name}}</option>{% endif %}{% endfor %}</select></label><label>Start time <input id="start" type="datetime-local" required></label><label>Reason <input id="reason" required></label><button>Request</button></form><small>Each appointment lasts 30 minutes. Times are entered in your browser's timezone.</small></section><section class="panel"><h2>Appointments</h2><div class="scroll"><table><thead><tr><th>Date / time</th><th>Patient</th><th>Provider</th><th>Type / reason</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>Change history</h2><pre id="history">Select History on an appointment.</pre></section></main><script>
const el=id=>document.getElementById(id);let items=[];const role=()=>el('user').selectedOptions[0].dataset.role;const headers=()=>({'Content-Type':'application/json','X-User-Id':el('user').value});function localIso(v){return new Date(v).toISOString()}async function call(url,options={}){const r=await fetch(url,{...options,headers:headers()});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}function say(s){el('message').textContent=s}function fmt(s){return new Date(s).toLocaleString()}async function load(){say('');el('request').style.display=role()==='patient'?'block':'none';try{items=(await call('/api/appointments/')).appointments;el('rows').replaceChildren();for(const a of items){const tr=document.createElement('tr');for(const v of [fmt(a.starts_at),a.patient_name,a.provider_name,a.appointment_type+' — '+a.reason,a.status]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td');const actions=role()==='patient'?(a.status==='confirmed'?['cancel','history']:['history']):(a.status==='pending'?['confirm','reschedule','history']:a.status==='confirmed'?['reschedule','history']:['history']);for(const action of actions){const b=document.createElement('button');b.textContent=action;b.onclick=()=>act(a,action);td.append(b)}tr.append(td);el('rows').append(tr)}}catch(e){say(e.message)}}async function act(a,action){try{if(action==='history'){const data=await call(`/api/appointments/${a.id}/history/`);el('history').textContent=JSON.stringify(data.history,null,2);return}let body={version:a.version};if(action==='reschedule'){const val=prompt('New local start date/time (YYYY-MM-DDTHH:MM)',new Date(a.starts_at).toLocaleString('sv-SE').replace(' ','T').slice(0,16));if(!val)return;body.starts_at=localIso(val)}await call(`/api/appointments/${a.id}/${action}/`,{method:'POST',body:JSON.stringify(body)});say('Saved');await load()}catch(e){say(e.message+' Refresh to see the latest appointment.')}}el('form').onsubmit=async e=>{e.preventDefault();try{await call('/api/appointments/',{method:'POST',body:JSON.stringify({provider_id:el('provider').value,starts_at:localIso(el('start').value),reason:el('reason').value})});el('form').reset();await load()}catch(err){say(err.message)}};el('user').onchange=load;load();</script></body></html>
